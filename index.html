<!DOCTYPE html>
<html lang="en">
<style>
    #playscreen {
        display: none;
    }
</style>
<head>
    <meta charset="UTF-8">

    <title>Shackled</title>

    <link rel="stylesheet" href ="https://pyscript.net/releases/2026.7.3/core.css">

    <script type = "module" src ="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alien+Block&display=swap" rel="stylesheet">


    <style> body {
        text-align: center;
        );
        font-family: "Orbitron";
        justify-content: center;
        display: flex;
        align-items: center;
        min-height: 100vh;
        flex-direction: column; }
    </style>
<!--background-image:url("./assets/Background.jpg"--> <!-- can be used to add your own picture as the background. the url tells where the file is and ./ tells which folder to search in. -->
    <style>h1 {
        font-size: 95px;
        text-shadow: 0 0 50px #c084fc;
    }</style>
    <style> p  {
        font-size: 55px;
        margin-top: -50px;
        font-family: AlienBlock;
        color: lightgray;
    }</style>

    <style>button {
        font-size: 26px;
        width: 250px;
        height: 35px;
        background: darkviolet;
        margin-top: 10px;
        font-weight: bolder;
        color: whitesmoke;

    }</style>

    <style>button:hover {
        background-color: #8b5cf6;
        box-shadow: 0 0 20px white;
    }</style>

    <style>
        #mainmenu button {
            display: block;
            margin: 10px auto;
        }
    </style>

</head>

<body>
    <div id="mainmenu">
    <h1>Calculator</h1>
    <p>A Menu for Different Calculators</p>
    <button id="mainscreenplay" onclick="goToPlayScreen()">Start</button>
    </div>



</div>

<script>
    function goToPlayScreen() {
        document.getElementById('mainmenu').style.display = 'none';

        document.getElementById('Calculator_Menu').style.display = 'block';
    }
</script>





 <!-- example button opening a window = <button id="test_button" onclick=" window.open('https://google.com', Important to open the window - '_blank')"> Google</button>-->


<div id = "Calculator_Menu">
    <button id = "math_button">Math Calculator</button>
    <button id = "tax_button">Tax Calculator</button>
    <button id = "unit_button">Unit Converter</button>

</div>

<style>
    #Calculator_Menu {
        display: none;
    }
</style>

<div id = "Math_Screen">
    <h1>Math Calculator</h1>
    <input id = "first_number" type = "number" placeholder="Enter a number">
    <input id = "second_number" type = "number" placeholder="Add">
    <button id = "calculate_button">Calculate</button>
</div>

<style>
    #Math_Screen {
        display: none;
    }
</style>


<script>
    document.getElementById("math_button").addEventListener("click", () => {
        fetch("/run/math");
    });

    document.getElementById("tax_button").addEventListener("click", () => {
        fetch("/run/tax");
    });

    document.getElementById("unit_button").addEventListener("click", () => {
        fetch("/run/unit");
    });
</script>
</body>
</html>
